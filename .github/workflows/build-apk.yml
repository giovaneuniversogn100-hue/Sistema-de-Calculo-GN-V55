name: Gerar APK - Sistema de Cálculo GN

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Aceitar licenças e instalar SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Descompactar projeto Android V56
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q Sistema_Calculo_GN_Android_V56_Corrigido.zip \
            -d android-project

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Limpar projeto
        working-directory: android-project
        run: gradle clean --no-daemon

      - name: Verificar dependências
        working-directory: android-project
        run: gradle dependencies --no-daemon

      - name: Gerar APK
        working-directory: android-project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Sistema-de-Calculo-GN-V56
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
